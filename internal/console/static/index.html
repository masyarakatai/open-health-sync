<html lang="en">
<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="ohs-console-mode" content="manage">
<title>Open Health Sync console</title>
<link rel="stylesheet" href="/console/console.css">
<script type="module" src="/console/app.mjs"></script>
</head>
<body>

  <symbol id="i-scroll" viewBox="0 0 16 16"><path d="M3 1.75h7.25L13 4.5v9.75H3z"/><path d="M5.5 6.25h5M5.5 8.75h5M5.5 11.25h3"/></symbol>
  <symbol id="i-signout" viewBox="0 0 16 16"><path d="M6.25 14.25h-3.5a1 1 0 0 1-1-1V2.75a1 1 0 0 1 1-1h3.5M10.5 11.5 14 8l-3.5-3.5M14 8H6"/></symbol>

  <symbol id="i-check-circle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="m5.25 8.25 1.9 1.9 3.6-3.9"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><path d="M7.13 2.25a1 1 0 0 1 1.74 0l5.6 9.75a1 1 0 0 1-.87 1.5H2.4a1 1 0 0 1-.87-1.5z"/><path d="M8 6.25v3M8 11.4v.1"/></symbol>
  <symbol id="i-alert-circle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75v3.75M8 10.9v.1"/></symbol>

<div class="app">
  <aside id="sidebar" class="sidebar" hidden>
   <div class="sidebar-inner">
    <a class="brand" href="#/overview"><span class="logo"><svg class="icon" aria-hidden="true"><use href="#i-pulse"/></svg></span>Open Health Sync</a>
    <div class="workspace">
      <span id="tenant-mark" class="mark"></span>
      <div class="workspace-text">
        <div id="tenant" class="workspace-name"></div>
        <div id="tenant-role" class="workspace-role"></div>
      </div>
    </div>
    <nav id="nav" class="nav" aria-label="Console">
      <div class="nav-group">Pipeline</div>
      <a href="#/overview"><svg class="icon" aria-hidden="true"><use href="#i-overview"/></svg>Overview</a>
      <a href="#/providers"><svg class="icon" aria-hidden="true"><use href="#i-plug"/></svg>Providers</a>
      <a href="#/users"><svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>Users</a>
      <a href="#/jobs"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg>Jobs</a>
      <a href="#/webhooks"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Webhooks</a>
      <div class="nav-group">Access</div>
      <a href="#/keys"><svg class="icon" aria-hidden="true"><use href="#i-key"/></svg>API keys</a>
      <a href="#/audit"><svg class="icon" aria-hidden="true"><use href="#i-scroll"/></svg>Audit log</a>
    </nav>
    <div class="sidebar-foot">
      <span id="mode" class="pill" hidden>Read only</span>
      <button id="signout" class="ghost" type="button"><svg class="icon" aria-hidden="true"><use href="#i-signout"/></svg>Sign out</button>
    </div>
   </div>
  </aside>
  <main id="main" class="main">
    <section id="signin" class="auth" hidden>
      <div class="auth-card">
        <div class="auth-brand"><span class="logo"><svg class="icon" aria-hidden="true"><use href="#i-pulse"/></svg></span>Open Health Sync</div>
        <div class="auth-panel">
          <h1>Sign in to the console</h1>
          <p class="lead">Paste a tenant API key. It stays in this tab only and goes to this server's API, nowhere else. Closing the tab forgets it.</p>
          <form id="signin-form" autocomplete="off">
            <label for="key">Tenant API key</label>
            <input id="key" name="key" class="mono" type="password" autocomplete="off" spellcheck="false" placeholder="ohs_sk_..." required>
            <button type="submit" class="primary">Sign in</button>
          </form>
          <p id="signin-error" class="form-error" role="alert"></p>
        </div>
        <p id="setup-link" class="auth-foot" hidden>First run? <a href="/console/setup">Set up this instance</a></p>
      </div>
    </section>
    <div id="view" class="view" hidden></div>
  </main>
</div>
<div id="flash" class="toasts" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<noscript><p>The console needs JavaScript.</p></noscript>
</body>
</html>
