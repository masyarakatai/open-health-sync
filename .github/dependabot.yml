version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /sdks/server/typescript
    schedule:
      interval: weekly
    groups:
      sdk-npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
