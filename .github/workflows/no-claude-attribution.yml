name: no-claude-attribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reject Claude authorship and trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            who=$(git log -1 --format='%an <%ae>%n%cn <%ce>' "$c")
            if echo "$who" | grep -qiE 'claude|anthropic'; then
              echo "::error::$c has a Claude author or committer: $(echo $who)"
              fail=1
            fi
            if git log -1 --format='%B' "$c" | grep -qiE '^\s*(co-authored-by:\s*claude|claude-session:)|generated with \[claude code\]'; then
              echo "::error::$c has a Claude attribution line in its message"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Rewrite these commits without Claude attribution (author, committer or trailer)."
            exit 1
          fi
          echo "No Claude attribution found."
